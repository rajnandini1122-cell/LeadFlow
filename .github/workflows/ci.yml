name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest

    # The unit suite imports the config module, and @nestjs/config validates the
    # environment the moment that module is loaded — before any test runs. A
    # developer machine hides the dependency, because Jest's working directory
    # is apps/api and apps/api/.env is picked up from there. CI has no .env, so
    # the suite failed to initialise on four undefined variables.
    #
    # EPHEMERAL CI-ONLY VALUES. None of these is a secret and none is
    # reachable: this job starts no database, no Redis and no provider, and the
    # unit tests mock Prisma. They exist solely to satisfy the schema so that
    # the validation itself stays strict.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci-not-a-real-user:ci-not-a-real-password@127.0.0.1:5432/leadflow_unit_ci
      DIRECT_DATABASE_URL: postgresql://ci-not-a-real-user:ci-not-a-real-password@127.0.0.1:5432/leadflow_unit_ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-ephemeral-access-secret-not-a-real-secret
      JWT_REFRESH_SECRET: ci-only-ephemeral-refresh-secret-not-a-real-secret
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build -w packages/api-types
      - run: npm run db:generate -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -w apps/api

  e2e:
    name: End-to-end (incl. mandatory tenant isolation)
    runs-on: ubuntu-latest

    # Unlike local development, CI runs the same images as production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow_ci
          POSTGRES_DB: leadflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U leadflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Must match the postgres service credentials above exactly. These are
      # throwaway CI values for an ephemeral container, not secrets.
      DATABASE_URL: postgresql://leadflow:leadflow_ci@localhost:5432/leadflow_test
      DIRECT_DATABASE_URL: postgresql://leadflow:leadflow_ci@localhost:5432/leadflow_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters-diff
      NODE_ENV: test
      LOG_LEVEL: fatal
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build -w packages/api-types
      - run: npm run db:generate -w apps/api

      # Proves the service, the credentials and DATABASE_URL agree BEFORE any
      # migration runs. A mismatch here previously surfaced as an opaque
      # Prisma connection error several steps later.
      - name: Verify database connectivity
        run: |
          for attempt in $(seq 1 20); do
            if pg_isready -h localhost -p 5432 -U leadflow -d leadflow_test; then
              break
            fi
            echo "waiting for postgres (attempt $attempt)"
            sleep 2
          done
          PGPASSWORD=leadflow_ci psql -h localhost -U leadflow -d leadflow_test \
            -c "select current_user, current_database(), version();"

      - run: npm run db:migrate:deploy -w apps/api

      # The schema Prisma expects must match what the migrations produced.
      #
      # Run from the API workspace. Prisma 7 loads prisma.config.ts from the
      # working directory, and that file is what supplies datasource.url —
      # which `migrate status` requires. Invoked from the repository root with
      # only --schema, the config was never loaded and the command failed with
      # "datasource.url property is required", before the suite could start.
      # The deploy step above already runs in the workspace, which is why it
      # succeeded where this one did not.
      - name: Verify migrations are complete
        working-directory: apps/api
        run: npx prisma migrate status

      # CI_USE_EXTERNAL_DB tells the Jest global setup to use the service
      # containers above instead of booting the in-process PGlite fallback that
      # exists for Docker-less development machines.
      - name: Run e2e suite
        run: npm run test:e2e -w apps/api
        env:
          CI_USE_EXTERNAL_DB: '1'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans TRACKED files only. An untracked local .env is not a leak; a
      # committed one is, and that distinction is the whole point of the check.
      - name: Scan tracked files for credentials
        run: |
          set -euo pipefail

          echo "--- committed .env files ---"
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "FAIL: a .env file is committed"
            exit 1
          fi
          echo "none"

          echo "--- private keys and provider credentials ---"
          # Two exclusions, both stated rather than silent — an exclusion nobody
          # can see is how a scan becomes theatre:
          #
          #   this workflow file, which necessarily contains every pattern it
          #   searches for and would otherwise flag itself on every run;
          #
          #   test files, whose fixtures legitimately contain key-shaped
          #   strings (env.schema.spec.ts asserts that a half-configured FCM
          #   provider is refused, which requires a private-key-shaped value).
          #
          # Both were found by this scan failing on its own repository.
          if git ls-files -z \
            | grep -zvE '^\.github/workflows/' \
            | grep -zvE '\.(spec|test)\.tsx?$' \
            | xargs -0 grep -lIE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"type": *"service_account"|AIza[0-9A-Za-z_-]{30}|sk_live_[0-9a-zA-Z]{20}|xox[baprs]-[0-9A-Za-z-]{10}|ghp_[A-Za-z0-9]{36}' 2>/dev/null; then
            echo "FAIL: a credential pattern is committed"
            exit 1
          fi
          echo "none"

          echo "--- debugging statements in shipped source ---"
          if git ls-files 'apps/api/src/**/*.ts' 'apps/web/src/**/*.ts' 'apps/web/src/**/*.tsx' \
            | grep -v '\.spec\.ts$' | grep -v '\.test\.tsx\?$' \
            | xargs grep -nE '\bdebugger\b|console\.log\(' 2>/dev/null; then
            echo "FAIL: debugger or console.log in shipped source"
            exit 1
          fi
          echo "none"

      # The redaction rules are a security control, and the previous phase
      # caught a defect in them where the keyword rule fired before the Bearer
      # rule and left the token in place. Run them on their own so a failure
      # here is unmistakable rather than buried in the unit output.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/api-types
      - run: npm run db:generate -w apps/api
      - name: Log redaction and error masking
        run: npm run test -w apps/api -- error-reporter all-exceptions

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build -w packages/api-types
      - run: npm run build -w apps/web

  docker:
    name: Production Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Plain `docker build`, no Buildx and no third-party actions. Docker is
      # preinstalled on the runner, nothing is pushed, and a gate whose job is
      # to prove the production image assembles should have as little between
      # it and the real thing as possible.
      #
      # The context is the REPOSITORY ROOT, not the Dockerfile's directory:
      # every COPY in it names a root-relative path (package.json,
      # packages/api-types/, apps/api/). Building from
      # infrastructure/deployment/ would fail on the first COPY.
      #
      # No secrets, no registry credentials, no Railway token. The image is
      # built and inspected locally on the runner and then discarded.
      - name: Build the production image
        run: |
          docker build \
            --file infrastructure/deployment/Dockerfile \
            --tag leadflow-ci:${{ github.sha }} \
            .

      # Building proves the Dockerfile parses and every COPY resolved. These
      # assertions prove the RESULT is the image we think it is — the
      # difference between "docker exited 0" and "this can actually run".
      #
      # Deliberately static. Starting the API would need a database, Redis and
      # real secrets, so a gate that tried would either need production
      # credentials or would be testing a misconfiguration. `sh -c test` reads
      # files and starts nothing.
      - name: Check the image contains what production needs
        run: |
          set -euo pipefail
          image=leadflow-ci:${{ github.sha }}

          run() { docker run --rm --entrypoint sh "$image" -c "$1"; }

          echo "--- both process entrypoints ---"
          # One image, two roles. The worker command is as load-bearing as the
          # API's: Railway overrides CMD to run it.
          run 'test -f apps/api/dist/main.js'
          run 'test -f apps/api/dist/worker.js'

          echo "--- the web app the API serves same-origin ---"
          # Without this the SPA 404s in production while every other check
          # stays green, because the API itself is perfectly healthy.
          run 'test -f apps/web/dist/index.html'
          run 'test -d apps/web/dist/assets'

          echo "--- Prisma runtime ---"
          run 'test -d apps/api/src/generated/prisma'
          run 'test -d node_modules/@prisma/client'
          run 'test -d node_modules/@prisma/adapter-pg'
          # Migrations ship with the image so a deploy can apply them from the
          # same artefact that will run against them.
          run 'test -d apps/api/prisma/migrations'

          echo "--- production dependencies only ---"
          # `npm ci --omit=dev` really omitted them. A runtime image carrying
          # TypeScript, Jest or the Prisma CLI is a runtime image that can
          # rewrite its own schema.
          run 'test ! -d node_modules/typescript'
          run 'test ! -d node_modules/jest'
          run 'test ! -d node_modules/prisma'

          echo "--- nothing from a developer machine ---"
          # A .env is gitignored and so cannot reach a clean checkout, but the
          # build stage does `COPY . .` and this is the cheap proof that
          # nothing local rode along into the final image.
          run 'test ! -f .env'

          echo "--- runs as a non-root user ---"
          user=$(docker image inspect --format '{{.Config.User}}' "$image")
          echo "USER=${user}"
          test "${user}" = "node"

          echo "--- default command ---"
          cmd=$(docker image inspect --format '{{json .Config.Cmd}}' "$image")
          echo "CMD=${cmd}"
          test "${cmd}" = '["node","apps/api/dist/main.js"]'

          echo "all image assertions passed"
